<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Calendify</title>
  <link rel="stylesheet" href="../styles/base.css">
</head>
<body>
  <div id="notice" class="cal-notice is-warn" hidden></div>

  <div class="container">
    <div class="form-row">
      <label for="eventTitle">Event Title:</label>
      <input type="text" id="eventTitle" placeholder="Enter event title">
    </div>
    <div class="form-row flex">
      <div class="form-col">
        <label for="eventDate">Date:</label>
        <input type="date" id="eventDate">
      </div>
      <div class="form-col">
        <label for="eventTime">Time:</label>
        <input type="time" id="eventTime">
      </div>
    </div>
    <div class="form-row">
      <label for="eventLocation">Location:</label>
      <input type="text" id="eventLocation" placeholder="Enter location (optional)">
    </div>
    <div class="form-row">
      <label for="eventDescription">Description:</label>
      <textarea id="eventDescription" rows="2" placeholder="Enter event description"></textarea>
    </div>
    <button id="addButton" type="button">Add to Calendar</button>
  </div>

  <!-- Copied from minutely/sidepanel.html:82-111, ids kept so the logic copied
       into popup.js lands unchanged. No engine pill: in a 400px popup it only
       restated what the hint says in words. -->
  <div class="cal-engine">
    <button class="cal-btn" id="enableNano" type="button" hidden>Download it</button>
  </div>
  <progress id="downloadBar" max="1" value="0" hidden></progress>
  <p class="cal-hint" id="engineHint">Checking what this copy of Chrome can do.</p>

  <!-- Collapsed by default and phrased as an alternative, not a requirement.
       Chrome's built-in model needs no key, so presenting an empty key field
       first made a zero-setup extension look like it was asking to be paid. -->
  <details class="cal-details" id="keyDetails">
    <summary>Use a Gemini API key instead <span class="cal-chev">&rsaquo;</span></summary>
    <div class="cal-details-body">
      <label for="apiKey">Gemini API key (optional)</label>
      <input type="password" id="apiKey" placeholder="AIza&hellip;" autocomplete="off" spellcheck="false">
      <p class="cal-hint cal-warn-text">
        A free key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI
        Studio</a> reads long pages in one pass. The page text is then sent to Google's Gemini API under your
        own account and its terms. Without a key nothing leaves this computer.
      </p>
      <div class="cal-row">
        <button class="cal-btn is-primary" id="saveKey" type="button">Save key</button>
        <button class="cal-btn" id="clearKey" type="button">Remove</button>
      </div>
    </div>
  </details>

  <div id="supportContainer">
    <div class="support-flex">
      <div id="supportText" class="support-text"></div>
      <a id="supportButton" class="support-button" target="_blank" href="#"></a>
    </div>
  </div>

  <script type="module" src="../js/popup.js"></script>
</body>
</html>
